services:
  postgres:
    image: postgres:16
    container_name: planejador-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: planejador_financeiro
      POSTGRES_USER: planejador
      POSTGRES_PASSWORD: planejador123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: